name: CD Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get latest tag
      id: get_tag
      run: |
        git fetch --tags
        LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
        if [ -z "$LATEST_TAG" ]; then
          LATEST_TAG="v0.0.0"
        fi
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "Latest tag: $LATEST_TAG"
    
    - name: Calculate new version
      id: version
      run: |
        LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
        VERSION=${LATEST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        
        # Get commits since last tag
        if [ "$LATEST_TAG" = "v0.0.0" ]; then
          COMMITS=$(git log --pretty=format:"%s" HEAD)
        else
          COMMITS=$(git log --pretty=format:"%s" ${LATEST_TAG}..HEAD)
        fi
        
        # Determine version bump
        if echo "$COMMITS" | grep -qiE "^(feat!|fix!|perf!|refactor!)|BREAKING CHANGE:"; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif echo "$COMMITS" | grep -qiE "^feat(\(.*\))?:"; then
          MINOR=$((MINOR + 1))
          PATCH=0
        elif echo "$COMMITS" | grep -qiE "^(fix|perf)(\(.*\))?:"; then
          PATCH=$((PATCH + 1))
        else
          PATCH=$((PATCH + 1))
        fi
        
        NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
    
    - name: Generate changelog
      id: changelog
      run: |
        LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
        
        if [ "$LATEST_TAG" = "v0.0.0" ]; then
          COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
        else
          COMMITS=$(git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD)
        fi
        
        CHANGELOG="## Changes\n\n$COMMITS"
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: version
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore src/EasySave.slnx
    
    - name: Run tests
      run: dotnet test src/EasySave.Tests/EasySave.Tests.csproj --configuration Release --verbosity normal

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [version, test]
    strategy:
      matrix:
        include:
          - os: win-x64
            output: EasySave-win-x64.exe
          - os: linux-x64
            output: EasySave-linux-x64
          - os: osx-x64
            output: EasySave-osx-x64
          - os: osx-arm64
            output: EasySave-osx-arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore src/EasySave.slnx
    
    - name: Build for ${{ matrix.os }}
      run: |
        dotnet publish src/EasySave.csproj \
          -c Release \
          -r ${{ matrix.os }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:Version=${{ needs.version.outputs.version_number }} \
          -o ./publish/${{ matrix.os }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: ./publish/${{ matrix.os }}/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    
    - name: Display structure
      run: ls -R ./artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.version.outputs.new_version }}
        name: ${{ needs.version.outputs.new_version }}
        body: ${{ needs.changelog.outputs.changelog }}
        draft: false
        prerelease: false
        files: |
          ./artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.EASYSAVE_TOKEN }}
