# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Lint with dotnet format
      run: |
        echo "Looking for solution files..."
        ls -la
        SOLUTION=$(ls *.sln 2>/dev/null | head -n 1)
        if [ -z "$SOLUTION" ]; then
          echo "No .sln file found in root, searching subdirectories..."
          SOLUTION=$(find . -name "*.sln" | head -n 1)
        fi
        echo "Using solution: $SOLUTION"
        dotnet format "$SOLUTION" --verify-no-changes --verbosity diagnostic
    
    - name: Build
      run: dotnet build --no-restore
    
    - name: Test
      run: dotnet test --no-build --verbosity normal
