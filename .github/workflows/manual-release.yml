name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      prerelease:
        description: 'Create as pre-release'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  manual-release:
    name: Create Manual Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z"
            exit 1
          fi

      - name: Check if tag exists
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Error: Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/EasySave.csproj

      - name: Build
        run: dotnet build src/EasySave.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/EasySave.Tests/EasySave.Tests.csproj --configuration Release --verbosity normal

      - name: Create tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          TAG_NAME="v${{ inputs.version }}"
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            TAG_NAME="${TAG_NAME}-rc"
          fi
          
          git tag -a "$TAG_NAME" -m "Manual release $TAG_NAME (${{ inputs.release_type }})"
          git push origin "$TAG_NAME"

      - name: Build Release
        run: |
          TAG_NAME="v${{ inputs.version }}"
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            TAG_NAME="${TAG_NAME}-rc"
          fi
          
          dotnet publish src/EasySave.csproj \
            -c Release \
            -o ./publish \
            /p:Version=${{ inputs.version }}

      - name: Create Release Archive
        run: |
          TAG_NAME="v${{ inputs.version }}"
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            TAG_NAME="${TAG_NAME}-rc"
          fi
          
          cd publish
          zip -r ../EasySave-${TAG_NAME}.zip .
          cd ..

      - name: Generate Release Notes
        run: |
          TAG_NAME="v${{ inputs.version }}"
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            TAG_NAME="${TAG_NAME}-rc"
          fi
          
          PREVIOUS_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | grep -v "beta" | grep -v "rc" | head -n 1)
          
          echo "## Release Type: ${{ inputs.release_type }}" > release_notes.md
          echo "" >> release_notes.md
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## Changes since ${PREVIOUS_TAG}" >> release_notes.md
            echo "" >> release_notes.md
            git log ${PREVIOUS_TAG}..HEAD \
              --pretty=format:"- %s (%h)" \
              --no-merges >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}${{ inputs.prerelease && '-rc' || '' }}
          name: Release v${{ inputs.version }}${{ inputs.prerelease && ' (Release Candidate)' || '' }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            EasySave-v${{ inputs.version }}${{ inputs.prerelease && '-rc' || '' }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
